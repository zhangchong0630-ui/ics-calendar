name: Update Shougang results

on:
  workflow_dispatch:
    inputs:
      full:
        description: "全量对账（同步改期、新阶段赛程、季后赛）"
        type: boolean
        default: false
  schedule:
    # 只在「比赛结束后 2.5 小时左右」跑：北京时间
    #   15:40 → 中午场（15:30 / 14:30 开球）
    #   22:10 → 常规晚场（19:35 开球，2 小时左右打完，再留缓冲）
    #   23:40 → 补一次，覆盖加时、点球或数据源延迟
    # 脚本本身还有守卫：没有「刚结束但还没比分」的比赛时会直接退出，
    # 不请求接口、不产生提交，所以多跑一次的开销可以忽略。
    - cron: "40 7 * * *"
    - cron: "10 14 * * *"
    - cron: "40 15 * * *"
    # 每周一北京时间 11:07 做一次全量对账（改期、新阶段赛程、季后赛公布）。
    - cron: "7 3 * * 1"

permissions:
  contents: write

concurrency:
  group: update-shougang-results
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Update Shougang ICS
        env:
          FULL: ${{ github.event.schedule == '7 3 * * 1' || inputs.full }}
        run: |
          if [ "$FULL" = "true" ]; then
            python3 scripts/update_shougang_scores.py --full
          else
            python3 scripts/update_shougang_scores.py
          fi

      - name: Commit updated ICS
        run: |
          if git diff --quiet -- beijing-shougang-2026.ics; then
            echo "No ICS changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beijing-shougang-2026.ics
          git commit -m "更新北京首钢 ICS 赛果"
          git push origin "HEAD:${GITHUB_REF_NAME}"
